[phases.setup]
nixPkgs = ['php81', 'php81Packages.composer', 'nginx', 'nodejs_18']

[phases.install]
cmds = [
  'composer install --no-dev --optimize-autoloader --ignore-platform-reqs',
  'npm ci'
]

[phases.build]
cmds = ['npm run prod']

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=8000'
